[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadquarry"
version = "0.4.0"
description = "Procedural generator for diverse, valid, parametric CadQuery programs and geometry — CC0 data, Apache-2.0 code"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Jacob Jennings", email = "jacob.r.jennings@gmail.com" }]
keywords = ["cad", "cadquery", "procedural-generation", "dataset", "parametric"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "cadquery>=2.4.0",
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
export = ["trimesh>=4.0", "matplotlib>=3.7"]
publish = ["huggingface_hub>=0.24", "pyarrow>=14.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
    "ruff>=0.4",
]

[project.scripts]
cadquarry = "cadquarry.__main__:main"

[project.urls]
Repository = "https://github.com/jacobjennings/CadQuarry"

[tool.hatch.build.targets.wheel]
packages = ["cadquarry"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
timeout = 60
testpaths = ["tests"]
addopts = "-v"
