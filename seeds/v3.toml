# CadQuarry v3 published seed list
#
# v3 broadens the procedural vocabulary well beyond the four parametric
# primitives (rect / circle / polygon / slot) of earlier versions:
#
#   * sketched — freeform closed 2D sketches (line / arc / Bézier / spline
#     loops) extruded into organic prisms or revolved into organic turned
#     bodies. The general sketch→extrude / sketch→revolve paradigm.
#   * lofted   — smooth lofts through stacked cross-sections (reducers/adapters)
#     plus a `lofted_adapter` compound archetype (lofted reducer + bored neck).
#   * swept    — a section swept along a smooth spline path (handles/tubes/ducts).
#   * tapped   — real cut ISO internal threads (bd_warehouse), like the existing
#     `threaded` family, in plates/blocks and cylinders.
#
# New operations also reach existing families: tapered (draft) extrudes, angled
# and multi-face holes. A plate-family validity-yield fix (bbox-aspect-aware
# stock thickness, hole-clearance-clamped corner fillets/chamfers) also changes
# that family's RNG-driven output.
#
# Because all of the above change the corpus for any given seed (and shift some
# geometry signatures), this is a NEW corpus generation published as v3 rather
# than an edit of v2. v1/v2 stay pinned to their old generators.
#
# Each [[corpus]] entry fully specifies a reproducible corpus: the published
# generator at `generator_version` plus the listed `seed`, `count`, and
# `config` regenerate it bit-for-bit (same manifest, same geometry signatures).
#
# Reproduce any entry:
#   cadquarry generate --seed <seed> --count <count> \
#       --config <config> --out datasets/<name>/
#
# The `gear` / `threaded` / `tapped` families require the `mech` extra:
#   uv pip install -e ".[mech]"

[meta]
generator_version = "0.6.0"   # cadquarry.__version__ this list targets
signature_version = 2         # geometry-signature definition (filter.SIGNATURE_VERSION)
config            = "configs/default.toml"
data_license      = "CC0-1.0"

# Pinned versions of the optional `mech` stack used by the gear / threaded /
# tapped families.  These are recorded for reproducibility; py_gearworks has no
# PyPI release and is pinned to a git commit.
[meta.mech]
cadquery     = ">=2.5.2"      # OCP 7.8 line (cadquery-ocp 7.8.1.x)
build123d    = ">=0.10.0"
bd_warehouse = ">=0.2.0"
py_gearworks = "git+https://github.com/GarryBGoode/py_gearworks@2fc2a13d82a9997a65f30c870498f0bb3be62318"

# ---------------------------------------------------------------------------
# Canonical corpora
# ---------------------------------------------------------------------------

[[corpus]]
name        = "smoke"
seed        = 42
count       = 100
config      = "configs/default.toml"
description = "Small smoke-test corpus across all families and tiers (incl. sketched/lofted/swept/tapped)."

[[corpus]]
name        = "demo-1k"
seed        = 1234
count       = 1000
config      = "configs/default.toml"
description = "Mid-size demonstration corpus; good for gallery browsing."

[[corpus]]
name        = "v3-10k"
seed        = 20260610
count       = 10000
config      = "configs/default.toml"
description = "Reference 10k corpus realizing the default family/tier distribution."

[[corpus]]
name        = "v3-50k"
seed        = 770077
count       = 50000
config      = "configs/default.toml"
description = "Large corpus for downstream dataset use."

# ---------------------------------------------------------------------------
# Published HuggingFace size ladder — NESTED PREFIX MODE
# ---------------------------------------------------------------------------
# All sizes are prefixes of ONE deterministic base corpus (shared base_seed).
# The generator's attempt stream is a pure function of (seed, index) and dedup
# runs in strict attempt order, so the first N accepted parts of the base ARE
# the count=N corpus.  Consequences:
#   * `cadquarry build` generates/exports/renders only the base once; every
#     smaller tag is a zero-cost `head -N` slice of it at publish time.
#   * The base can be EXTENDED to larger sizes later without redoing work:
#     `cadquarry build --extend-to 500000` replays the attempt stream from the
#     recorded high-water mark and appends only the new parts (existing parts,
#     STEP, STL, and renders are reused untouched).  Smaller tags stay
#     byte-identical as the base grows; only new larger sizes appear.

[publish]
# Default destination dataset name. With no "user/" namespace it resolves to
# "<your-hf-username>/cadquarry" from your token, so this works for anyone.
# Override with --repo-id or the CADQUARRY_HF_REPO env var.
repo_id   = "cadquarry"
mode      = "prefix"      # tags are prefixes of one base corpus (shared base_seed)
base_seed = 220220        # the single seed all sizes are drawn from
base_tag  = "base"        # base corpus dir name under the build root
# base_count is the largest tag below (currently 100k). Raise it (or add a
# larger tag) and run `cadquarry build --extend-to N` to grow the dataset.

[[publish.corpus]]
tag = "1k"
count = 1000

[[publish.corpus]]
tag = "2k"
count = 2000

[[publish.corpus]]
tag = "5k"
count = 5000

[[publish.corpus]]
tag = "10k"
count = 10000

[[publish.corpus]]
tag = "20k"
count = 20000

[[publish.corpus]]
tag = "50k"
count = 50000

[[publish.corpus]]
tag = "100k"
count = 100000
