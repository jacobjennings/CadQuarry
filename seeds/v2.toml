# CadQuarry v2 published seed list
#
# v2 introduces two build123d-backed families — `gear` (py_gearworks) and
# `threaded` (bd_warehouse) — and bumps the CadQuery floor to align the OCP
# kernel with that stack.  Because the new families change the RNG-driven
# corpus for any given seed (and the kernel bump can shift geometry signatures
# of existing families too), this is a NEW corpus generation published as v2
# rather than an edit of v1.  v1 stays pinned to the old generator/CadQuery.
#
# Each [[corpus]] entry fully specifies a reproducible corpus: the published
# generator at `generator_version` plus the listed `seed`, `count`, and
# `config` regenerate it bit-for-bit (same manifest, same geometry signatures).
#
# Reproduce any entry:
#   cadquarry generate --seed <seed> --count <count> \
#       --config <config> --out datasets/<name>/
#
# The `gear`/`threaded` families require the `mech` extra to execute:
#   uv pip install -e ".[mech]"

[meta]
generator_version = "0.5.0"   # cadquarry.__version__ this list targets
signature_version = 2         # geometry-signature definition (filter.SIGNATURE_VERSION)
config            = "configs/default.toml"
data_license      = "CC0-1.0"

# Pinned versions of the optional `mech` stack used by the gear/threaded
# families.  These are recorded for reproducibility; py_gearworks has no PyPI
# release and is pinned to a git commit.
[meta.mech]
cadquery     = ">=2.5.2"      # OCP 7.8 line (cadquery-ocp 7.8.1.x)
build123d    = ">=0.10.0"
bd_warehouse = ">=0.2.0"
py_gearworks = "git+https://github.com/GarryBGoode/py_gearworks@2fc2a13d82a9997a65f30c870498f0bb3be62318"

# ---------------------------------------------------------------------------
# Canonical corpora
# ---------------------------------------------------------------------------

[[corpus]]
name        = "smoke"
seed        = 42
count       = 100
config      = "configs/default.toml"
description = "Small smoke-test corpus across all families and tiers (incl. gear/threaded)."

[[corpus]]
name        = "demo-1k"
seed        = 1234
count       = 1000
config      = "configs/default.toml"
description = "Mid-size demonstration corpus; good for gallery browsing."

[[corpus]]
name        = "v2-10k"
seed        = 20260605
count       = 10000
config      = "configs/default.toml"
description = "Reference 10k corpus realizing the default family/tier distribution."

[[corpus]]
name        = "v2-50k"
seed        = 770077
count       = 50000
config      = "configs/default.toml"
description = "Large corpus for downstream dataset use."

# ---------------------------------------------------------------------------
# Published HuggingFace size ladder
# ---------------------------------------------------------------------------
# These are the corpora `cadquarry publish` packs and uploads as
# configs of the HuggingFace dataset.  Each `tag` becomes a load_dataset
# config name; `seed` + `count` + the generator version pin it bit-for-bit.

[publish]
# Default destination dataset name. With no "user/" namespace it resolves to
# "<your-hf-username>/cadquarry" from your token, so this works for anyone.
# Override with --repo-id or the CADQUARRY_HF_REPO env var.
repo_id = "cadquarry"

[[publish.corpus]]
tag = "1k"
count = 1000
seed = 1234

[[publish.corpus]]
tag = "2k"
count = 2000
seed = 2468

[[publish.corpus]]
tag = "5k"
count = 5000
seed = 50500

[[publish.corpus]]
tag = "10k"
count = 10000
seed = 20260605

[[publish.corpus]]
tag = "20k"
count = 20000
seed = 200200

[[publish.corpus]]
tag = "50k"
count = 50000
seed = 770077

[[publish.corpus]]
tag = "100k"
count = 100000
seed = 100100

[[publish.corpus]]
tag = "200k"
count = 200000
seed = 220220
